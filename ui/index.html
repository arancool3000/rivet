<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rivet</title>
<link rel="icon" href="logo.svg">
<link rel="stylesheet" href="static/katex/katex.min.css"><script src="static/katex/katex.min.js"></script>
<script src="static/qrcode.js"></script><script src="static/cm/codemirror.js"></script><script src="static/cm/runmode.js"></script>
<script src="static/cm/xml.js"></script><script src="static/cm/javascript.js"></script><script src="static/cm/css.js"></script>
<script src="static/cm/htmlmixed.js"></script><script src="static/cm/python.js"></script><script src="static/cm/shell.js"></script>
<script src="static/cm/simple.js"></script><script src="static/cm/clike.js"></script><script src="static/cm/rust.js"></script><script src="static/cm/go.js"></script>
<script src="static/cm/sql.js"></script><script src="static/cm/yaml.js"></script><script src="static/cm/markdown.js"></script>
<style>
:root{
  --bg:#f7f6f3;--side:#efeee9;--panel:#ffffff;--raise:#ffffff;--ink:#1f1e1c;--ink2:#4a4844;--mute:#8a877f;--faint:#b9b5ac;
  --line:#e4e1da;--line2:#d6d2c9;--hover:rgba(31,30,28,.05);--sel:rgba(31,30,28,.08);
  --acc:#e5531a;--acc-ink:#fff;--acc-soft:rgba(229,83,26,.10);--ok:#2f8a4f;--bad:#c4372b;
  --code-bg:#f2f0eb;--me:#ecebe6;--shadow:0 1px 2px rgba(0,0,0,.04),0 8px 28px rgba(0,0,0,.07);
  --r:12px;--font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",sans-serif;--mono:ui-monospace,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#18181a;--side:#121214;--panel:#1f1f22;--raise:#26262a;--ink:#ecebe8;--ink2:#c4c2bd;--mute:#8b8983;--faint:#5c5a56;
  --line:#2b2b2f;--line2:#36363b;--hover:rgba(255,255,255,.05);--sel:rgba(255,255,255,.08);
  --acc:#ff6a2b;--acc-soft:rgba(255,106,43,.14);--code-bg:#141416;--me:#2a2a2e;--shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35);
}}
*{box-sizing:border-box}html,body{height:100%;margin:0}html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font:14.5px/1.6 var(--font);display:flex;overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,textarea,select{font:inherit;color:inherit}
svg.i{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
::selection{background:var(--acc-soft)}
/* ---------- sidebar ---------- */
#side{width:256px;flex:none;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;transition:margin .18s ease}
body.noside #side{margin-left:-256px}
.drag{-webkit-app-region:drag}.nodrag{-webkit-app-region:no-drag}
.brand{display:flex;align-items:center;gap:9px;padding:42px 16px 14px;font-weight:650;font-size:15px;letter-spacing:-.01em}
.brand img{width:26px;height:26px;border-radius:7px}
.sbtn{display:flex;align-items:center;gap:9px;margin:0 10px;padding:8px 10px;border-radius:9px;color:var(--ink2);font-size:13.5px}
.sbtn:hover{background:var(--hover);color:var(--ink)}.sbtn kbd{margin-left:auto}
kbd{font:11px var(--font);color:var(--mute);border:1px solid var(--line2);border-radius:5px;padding:0 5px;background:transparent}
#search{margin:6px 10px 8px;padding:7px 10px 7px 32px;border-radius:9px;border:1px solid transparent;background:var(--hover);outline:0;font-size:13px;width:calc(100% - 20px)}
#search:focus{border-color:var(--line2);background:var(--panel)}
.searchwrap{position:relative}.searchwrap svg{position:absolute;left:21px;top:15px;color:var(--mute)}
#chats{flex:1;overflow-y:auto;padding:0 8px 8px}
.grp{font-size:11px;font-weight:600;color:var(--mute);margin:14px 10px 4px;letter-spacing:.02em}
.ci{display:flex;align-items:center;gap:4px;padding:6px 10px;border-radius:8px;cursor:pointer;font-size:13.5px;color:var(--ink2)}
.ci span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ci:hover{background:var(--hover);color:var(--ink)}.ci.on{background:var(--sel);color:var(--ink);font-weight:500}
.ci .act{display:none;color:var(--mute);padding:2px;border-radius:5px}.ci:hover .act{display:block}.ci .act:hover{color:var(--ink);background:var(--hover)}
.ci .pin{color:var(--acc);display:block}
.sidefoot{border-top:1px solid var(--line);padding:10px 12px;display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--mute)}
/* ---------- main ---------- */
main{flex:1;display:flex;flex-direction:column;min-width:0;position:relative}
.top{height:50px;flex:none;display:flex;align-items:center;gap:6px;padding:0 12px 0 14px}
body.noside .top{padding-left:84px}
.ib{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--mute)}
.ib:hover{background:var(--hover);color:var(--ink)}.ib.on{color:var(--acc);background:var(--acc-soft)}
#title{font-weight:600;font-size:13.5px;padding:4px 8px;border-radius:7px;max-width:50%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:text}
#title:hover{background:var(--hover)}
.sp{flex:1}
#log{flex:1;overflow-y:auto;scroll-behavior:auto;display:flex;flex-direction:column}
.col{width:100%;box-sizing:border-box;max-width:760px;margin:0 auto;padding:6px 28px 10px}
#msgs{flex:1 0 auto;display:flex;flex-direction:column;justify-content:flex-end}   /* always pin messages to the bottom, above the composer */
#msgs.top{justify-content:flex-start}                                             /* greeting screen sits at the top instead */
/* ---------- messages ---------- */
.m{margin:22px 0;position:relative;min-width:0;max-width:100%}
.m.me{display:flex;flex-direction:column;align-items:flex-end}
.me .b{background:var(--me);padding:9px 15px;border-radius:18px;max-width:82%;white-space:pre-wrap;word-wrap:break-word;overflow-wrap:anywhere;word-break:break-all;min-width:0}
.me .q{max-width:82%;border-left:2px solid var(--acc);padding:2px 10px;margin-bottom:6px;color:var(--mute);font-size:13px;white-space:pre-wrap;max-height:90px;overflow:hidden}
.me img.att{max-width:240px;max-height:240px;border-radius:14px;margin-bottom:6px;display:block;border:1px solid var(--line)}
.ai .who{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--mute);margin-bottom:6px}
.ai .who img{width:20px;height:20px;border-radius:5px}
.ai .who b{color:var(--ink2);font-weight:600}
.acts{display:flex;gap:2px;margin-top:6px;opacity:0;transition:opacity .12s}.m:hover .acts,.m.last .acts{opacity:1}
.acts button{display:flex;align-items:center;gap:5px;color:var(--mute);font-size:12px;padding:4px 7px;border-radius:7px}
.acts button:hover{background:var(--hover);color:var(--ink)}
.meta{color:var(--faint);font-size:11.5px;margin-left:6px;align-self:center}
/* prose */
.md{word-wrap:break-word;overflow-wrap:anywhere;min-width:0}.md>*:first-child{margin-top:0}.md>*:last-child{margin-bottom:0}
.md p{margin:0 0 10px}.md h1,.md h2,.md h3,.md h4{margin:20px 0 8px;line-height:1.3;letter-spacing:-.01em}
.md h1{font-size:20px}.md h2{font-size:17.5px}.md h3{font-size:15.5px}.md h4{font-size:14.5px}
.md ul,.md ol{margin:4px 0 10px;padding-left:22px}.md li{margin:3px 0}.md li>ul,.md li>ol{margin:2px 0}
.md a{color:var(--acc);text-decoration:none;border-bottom:1px solid var(--acc-soft)}.md a:hover{border-color:var(--acc)}
.md blockquote{margin:8px 0 12px;padding:2px 14px;border-left:3px solid var(--line2);color:var(--ink2)}
.md hr{border:0;border-top:1px solid var(--line);margin:18px 0}
.md code{font:12.8px var(--mono);background:var(--code-bg);padding:1.5px 5px;border-radius:5px;overflow-wrap:anywhere;word-break:break-all}  /* break-all: iOS Safari won't break long tokens on overflow-wrap alone */
.md table{border-collapse:collapse;margin:8px 0 14px;font-size:13.5px;display:block;overflow-x:auto;max-width:100%}
.md th,.md td{border:1px solid var(--line);padding:6px 11px;text-align:left;vertical-align:top}.md th{background:var(--code-bg);font-weight:600}
.md del{color:var(--mute)}
.codeblk{margin:10px 0 14px;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--code-bg);max-width:100%;min-width:0}
.codeblk .ch{display:flex;align-items:center;gap:6px;padding:5px 8px 5px 12px;font-size:11.5px;color:var(--mute);border-bottom:1px solid var(--line)}
.codeblk .ch button{display:flex;align-items:center;gap:4px;padding:3px 7px;border-radius:6px;font-size:11.5px;color:var(--mute)}.codeblk .ch button:hover{background:var(--hover);color:var(--ink)}
.codeblk pre{margin:0;padding:12px 14px;overflow-x:auto;font:12.8px/1.6 var(--mono);white-space:pre;max-width:100%;min-width:0}
.katex{font-size:1.06em}.katex-display{margin:10px 0;overflow-x:auto;overflow-y:hidden;padding:2px 0}
/* syntax colours (light / dark) */
.cm-keyword{color:#a6380f}.cm-def{color:#1d5fa8}.cm-variable-2,.cm-variable-3,.cm-type{color:#2b6f6b}.cm-string,.cm-string-2{color:#2f7a3d}
.cm-number{color:#9b4dca}.cm-comment{color:#9a958b;font-style:italic}.cm-atom,.cm-builtin{color:#9b4dca}.cm-tag{color:#a6380f}.cm-attribute{color:#1d5fa8}.cm-property{color:#3a5d8f}.cm-meta{color:#8a6d00}
@media (prefers-color-scheme:dark){.cm-keyword{color:#ff8a5b}.cm-def{color:#7cb3ff}.cm-variable-2,.cm-variable-3,.cm-type{color:#6fd3c5}.cm-string,.cm-string-2{color:#a5d68a}
.cm-number,.cm-atom,.cm-builtin{color:#d1a2ff}.cm-comment{color:#6f6c66}.cm-tag{color:#ff8a5b}.cm-attribute{color:#7cb3ff}.cm-property{color:#a8c4ff}.cm-meta{color:#e0c060}}
/* steps: thinking + tools */
.steps{display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
.step{border:1px solid var(--line);border-radius:10px;background:var(--panel);font-size:12.8px;color:var(--ink2);overflow:hidden}
.step>summary{list-style:none;display:flex;align-items:center;gap:8px;padding:7px 11px;cursor:pointer;color:var(--mute)}
.step>summary::-webkit-details-marker{display:none}
.step>summary b{color:var(--ink2);font-weight:550}.step>summary .arg{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:420px}
.step[open]>summary .chev{transform:rotate(90deg)}.chev{transition:transform .12s;margin-left:auto}
.step .body{padding:0 12px 10px;white-space:pre-wrap;font:12px/1.5 var(--mono);color:var(--mute);max-height:260px;overflow:auto}
.step.think .body{font:13px/1.55 var(--font);white-space:normal;color:var(--mute)}.thinkmd p{margin:0 0 6px}.thinkmd strong{color:var(--ink2)}.thinkmd .codeblk{font-style:normal}
.spin{width:12px;height:12px;border:1.8px solid var(--line2);border-top-color:var(--acc);border-radius:50%;animation:spin .8s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
.ok-dot{width:7px;height:7px;border-radius:50%;background:var(--ok);flex:none}
.approve{border:1px solid var(--acc);background:var(--acc-soft);border-radius:10px;padding:10px 12px;font-size:13px}
.approve code{font:12px var(--mono)}.approve .row{display:flex;gap:6px;margin-top:8px}
.btn{padding:5px 12px;border-radius:8px;border:1px solid var(--line2);background:var(--panel);font-size:12.5px;font-weight:550}
.btn:hover{border-color:var(--faint)}.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.status{display:flex;align-items:center;gap:8px;color:var(--mute);font-size:13px}
.err{color:var(--bad);font-size:13.5px}
.typing{display:inline-flex;gap:4px;padding:6px 0}.typing i{width:6px;height:6px;border-radius:50%;background:var(--faint);animation:blink 1.2s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}@keyframes blink{0%,80%,100%{opacity:.3}40%{opacity:1}}
/* empty state */
.empty{text-align:center;padding-top:14vh}.empty img{width:72px;height:72px;border-radius:18px;box-shadow:var(--shadow)}
.empty h1{font-size:24px;font-weight:650;letter-spacing:-.02em;margin:18px 0 6px}.empty p{color:var(--mute);margin:0 0 26px}
.starts{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:560px;margin:0 auto;text-align:left}
.starts button{text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:12px 14px;font-size:13.5px;transition:border-color .12s}
.starts button:hover{border-color:var(--line2)}.starts b{display:block;font-weight:600;margin-bottom:2px}.starts span{color:var(--mute);font-size:12.5px}
/* composer */
.foot{padding:0 28px 18px}
.dock{max-width:760px;margin:0 auto}
#queue{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.qi{align-self:flex-end;max-width:82%;display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.qi .b{background:var(--me);opacity:.75;padding:7px 13px;border-radius:16px;font-size:13.5px;white-space:pre-wrap;word-wrap:break-word;border:1px dashed var(--line2)}
.qi .qimgs{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end;max-width:100%}
.qi .qimgs img{width:52px;height:52px;object-fit:cover;border-radius:10px;opacity:.8;border:1px dashed var(--line2)}
.qi .qa{display:flex;gap:2px;align-items:center;color:var(--mute);font-size:12px}
.qi .qa button{padding:3px 6px;border-radius:6px;display:flex;align-items:center;gap:4px}.qi .qa button:hover{background:var(--hover);color:var(--ink)}
.box{background:var(--panel);border:1px solid var(--line2);border-radius:18px;box-shadow:var(--shadow);transition:border-color .12s}
.box:focus-within{border-color:var(--faint)}.box.dragover{border-color:var(--acc)}
.quote{display:flex;gap:8px;align-items:flex-start;margin:10px 12px 0;padding:6px 10px;border-left:2px solid var(--acc);background:var(--hover);border-radius:0 8px 8px 0;font-size:12.5px;color:var(--ink2)}
.quote span{flex:1;max-height:60px;overflow:hidden;white-space:pre-wrap}
#thumbs{display:flex;gap:8px;padding:10px 12px 0}#thumbs:empty{display:none}
.th{position:relative}.th img{width:58px;height:58px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
.th button{position:absolute;top:-6px;right:-6px;width:18px;height:18px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center}
textarea#in{display:block;width:100%;border:0;outline:0;resize:none;background:transparent;padding:13px 16px 4px;height:48px;max-height:240px;line-height:1.5}
.bar{display:flex;align-items:center;gap:2px;padding:6px 8px 8px;flex-wrap:wrap;row-gap:4px}
.pill{display:flex;align-items:center;gap:6px;padding:5px 9px;border-radius:9px;font-size:12.5px;color:var(--ink2);white-space:nowrap}
.pill:hover{background:var(--hover);color:var(--ink)}.pill.hot{color:var(--acc)}
.pill .count{background:var(--acc);color:var(--acc-ink);border-radius:9px;font-size:10.5px;padding:0 6px;font-weight:600}
#send{width:32px;height:32px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;margin-left:4px}
#send:disabled{opacity:.25;cursor:default}#send.stop{background:var(--ink)}
#mic.rec{color:#fff;background:var(--bad);animation:pulse 1.2s infinite}@keyframes pulse{50%{box-shadow:0 0 0 6px rgba(196,55,43,.18)}}
.hint{text-align:center;color:var(--faint);font-size:11.5px;margin-top:8px}
/* menus */
.menu{position:fixed;z-index:50;background:var(--raise);border:1px solid var(--line2);border-radius:12px;box-shadow:var(--shadow);padding:6px;min-width:240px;display:none}
.menu.open{display:block}
.mi{display:flex;align-items:center;gap:10px;padding:7px 9px;border-radius:8px;cursor:pointer;font-size:13px}
.mi:hover{background:var(--hover)}.mi .d{color:var(--mute);font-size:11.5px;line-height:1.35}.mi .tx{flex:1}
.mi .ck{width:16px;color:var(--acc);visibility:hidden}.mi.on .ck{visibility:visible}
.msep{height:1px;background:var(--line);margin:5px 4px}.mlabel{font-size:11px;color:var(--mute);padding:6px 9px 3px;font-weight:600}
.sw{width:28px;height:16px;border-radius:9px;background:var(--line2);position:relative;flex:none;transition:background .12s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:50%;background:#fff;transition:left .12s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.mi.on .sw{background:var(--acc)}.mi.on .sw::after{left:14px}
/* selection popup */
#selpop{position:fixed;z-index:60;display:none;flex-direction:column;width:min(440px,90vw);background:var(--raise);border:1px solid var(--line2);border-radius:14px;box-shadow:var(--shadow);padding:10px 12px}
#selpop.open{display:flex}#selpop button{display:grid;place-items:center;width:30px;height:30px;border-radius:8px;color:var(--mute)}#selpop button:hover{color:var(--ink)}
#selpop button:hover{background:var(--hover)}#selpop .sep{width:1px;height:18px;background:var(--line)}
/* right panel */
#right{width:0;flex:none;border-left:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;overflow:hidden;transition:width .18s ease}
body.rp #right{width:min(48vw,640px)}
.rtabs{height:50px;display:flex;align-items:center;gap:4px;padding:0 10px;border-bottom:1px solid var(--line);flex:none}
.rtab{padding:5px 10px;border-radius:8px;font-size:12.5px;color:var(--mute)}.rtab.on{background:var(--sel);color:var(--ink);font-weight:550}
.rpane{flex:1;display:none;flex-direction:column;min-height:0}.rpane.on{display:flex}
#wsframe{flex:1;border:0;width:100%;background:#141417}
#sidelog{flex:1;overflow-y:auto;padding:4px 18px 18px}
#sidelog .m{margin:16px 0}
.sidefoot2{padding:10px 12px;border-top:1px solid var(--line)}
.sidefoot2 .box{border-radius:14px}.sidefoot2 textarea{display:block;width:100%;border:0;outline:0;resize:none;background:transparent;padding:10px 12px;height:44px;max-height:160px}
.ctx{margin:12px 0 4px;padding:8px 12px;border-left:2px solid var(--acc);background:var(--hover);border-radius:0 8px 8px 0;font-size:12.5px;color:var(--ink2);white-space:pre-wrap;max-height:120px;overflow:auto}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:7px 14px;border-radius:9px;font-size:12.5px;opacity:0;transition:opacity .15s;pointer-events:none;z-index:80}.toast.on{opacity:.94}
@media (max-width:860px){
  /* narrow screens (phone): the sidebar is an OVERLAY drawer, not a column — it must never push the chat off-screen */
  #side{position:fixed;top:0;bottom:0;left:0;z-index:60;margin-left:-256px;box-shadow:var(--shadow)}
  body.showside #side{margin-left:0}
  #scrim{position:fixed;inset:0;z-index:55;background:rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity .18s ease}
  body.showside #scrim{opacity:1;pointer-events:auto}
  .top{padding-left:84px}.col,.foot{padding-left:16px;padding-right:16px}
  .col{max-width:100%;min-width:0}            /* phone: never let the message column grow past the screen (its max-width:760 + auto margins otherwise size it to wide content) */
  #modelLbl,#thinkLbl{max-width:110px;overflow:hidden;text-overflow:ellipsis}.starts{grid-template-columns:1fr}}
@media (min-width:861px){#scrim{display:none}}
.compacted{opacity:.45}
.cdiv{margin:18px 0;border:1px dashed var(--line2);border-radius:10px;font-size:12.8px;color:var(--mute)}
.cdiv summary{list-style:none;cursor:pointer;padding:8px 12px;display:flex;align-items:center;gap:8px}.cdiv summary::-webkit-details-marker{display:none}
.cdiv .md{padding:0 14px 12px;color:var(--ink2)}
#meter{font-variant-numeric:tabular-nums}
.qr{display:grid;place-items:center;padding:10px;background:#fff;border-radius:10px;margin:8px 4px}.qr img{width:200px;height:200px;image-rendering:pixelated}
.phonetxt{font-size:12.5px;color:var(--ink2);padding:2px 9px 6px;line-height:1.5}.phonetxt code{font:11.5px var(--mono);word-break:break-all;color:var(--mute)}
body.onphone #wsBtn,body.onphone #phoneBtn,body.onphone #voiceSel{display:none}
@media (max-width:600px){.top{padding-left:10px}.col{padding:4px 12px 20px}.foot{padding:0 10px 10px}.me .b{max-width:90%}.hint{display:none}}
.wave{width:16px;height:16px;flex:none;display:inline-block}.wave.big{width:30px;height:30px}
.wave path{fill:none;stroke-linecap:round;stroke-linejoin:round;transform-origin:50% 50%;transform-box:fill-box;will-change:transform}
.wave .r1{stroke:url(#wg1);stroke-width:3.2;animation:wr 3s linear infinite}
.wave .r2{stroke:url(#wg2);stroke-width:2.2;opacity:.75;animation:wr 5s linear infinite reverse}
.wave .r3{stroke:url(#wg2);stroke-width:2;opacity:.55;animation:wr 2.2s linear infinite}

/* ================= markdown ================= */
function highlight(code,lang){
  const map={js:'javascript',javascript:'javascript',ts:'text/typescript',typescript:'text/typescript',json:'application/json',py:'python',python:'python',

  return out}
function inline(t){
  return t.replace(/`([^`]+)`/g,(_,c)=>'\u0002'+btoa(unescape(encodeURIComponent(c)))+'\u0003')
   .replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/__([^_]+)__/g,'<strong>$1</strong>')
   .replace(/(^|[^*\w])\*([^*\n]+)\*(?!\w)/g,'$1<em>$2</em>').replace(/(^|[^_\w])_([^_\n]+)_(?!\w)/g,'$1<em>$2</em>')
   .replace(/~~([^~]+)~~/g,'<del>$1</del>')
   .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g,'<a href="$2" target="_blank">$1</a>')
   .replace(/(^|[\s(])(https?:\/\/[^\s<)]+[^\s<).,;:!?])/g,'$1<a href="$2" target="_blank">$2</a>')
   .replace(/\u0002([^\u0003]+)\u0003/g,(_,b)=>'<code>'+esc(decodeURIComponent(escape(atob(b))))+'</code>')}

  const put=(tex,d)=>{let h;try{h=katex.renderToString(tex,{displayMode:d,throwOnError:false})}catch(e){h=esc(tex)}store.push(h);return '\u0001'+(store.length-1)+'\u0001'};

function prose(src){
  const store=[];const lines=esc(mathOut(src,store)).split('\n');let out='',i=0;
  const isTable=i=>/^\s*\|.*\|\s*$/.test(lines[i]||'')&&/^\s*\|?\s*:?-{2,}/.test(lines[i+1]||'');
  function list(i,indent){let tag=/^\s*\d+[.)]\s/.test(lines[i])?'ol':'ul',h='<'+tag+'>';
    while(i<lines.length){const m=lines[i].match(/^(\s*)([-*+]|\d+[.)])\s+(.*)$/);if(!m)break;const ind=m[1].length;
      if(ind<indent)break;if(ind>indent){const r=list(i,ind);h=h.replace(/<\/li>$/,'')+r[0]+'</li>';i=r[1];continue}
      h+='<li>'+inline(m[3].replace(/^\[ \]\s/,'☐ ').replace(/^\[x\]\s/i,'☑ '))+'</li>';i++}
    return[h+'</'+tag+'>',i]}
  while(i<lines.length){const l=lines[i];
    if(!l.trim()){i++;continue}
    let m;
    if((m=l.match(/^(#{1,6})\s+(.*)/))){const n=Math.min(4,m[1].length);out+=`<h${n}>${inline(m[2])}</h${n}>`;i++;continue}
    if(/^\s*([-*_])(\s*\1){2,}\s*$/.test(l)){out+='<hr>';i++;continue}
    if(/^\s*&gt;/.test(l)){let q=[];while(i<lines.length&&/^\s*&gt;/.test(lines[i]))q.push(lines[i++].replace(/^\s*&gt;\s?/,''));out+='<blockquote>'+prose_inner(q.join('\n'))+'</blockquote>';continue}
    if(/^\s*([-*+]|\d+[.)])\s+/.test(l)){const r=list(i,(l.match(/^\s*/)[0]).length);out+=r[0];i=r[1];continue}
    if(isTable(i)){const row=s=>s.trim().replace(/^\||\|$/g,'').split('|').map(c=>c.trim());

    h+=`<div class="qr"><img src="${q.createDataURL(6,2)}" alt="QR code"></div><div class="phonetxt">${p.relay?'Works anywhere, even on cellular. ':''}Scan with your phone's camera, then tap <b>Add to Home Screen</b> in Safari's share menu to make it an app.<br><code>${esc(p.url)}</code>${p.relay?'<br><span class="warn">Keep this link private — anyone with it gets full access.</span>':''}</div>
      <div class="msep"></div><div class="mi" data-new><svg class="i"><use href="#i-retry"/></svg><div class="tx">New link<div class="d">Signs out every phone that's paired now</div></div></div>`}
  else if(p.on)h+='<div class="phonetxt">Starting up...</div>';
  else h+='<div class="phonetxt">Off. Nothing outside this Mac can reach Rivet.</div>';
  openMenu('#phoneMenu',anchor,h,m=>{m.querySelectorAll('.mi').forEach(x=>x.onclick=async()=>{
    const body='new' in x.dataset?{new_key:true}:{on:!p.on};await post('/phone',body).catch(()=>{});
    m.innerHTML='<div class="phonetxt">Restarting Rivet\'s server...</div>';
    for(let i=0;i<30;i++){await new Promise(r=>setTimeout(r,500));try{await fetch('/state');break}catch(e){}}
    phoneMenu(anchor)})});
  const mm=$('#phoneMenu'),r=anchor.getBoundingClientRect();mm.style.top=Math.max(8,r.top-mm.offsetHeight-8)+'px'}
$('#phoneBtn').onclick=e=>phoneMenu(e.currentTarget);
/* phone voice: the phone's own speech, since Rivet's voice plays on the Mac */
function phoneSay(t){if(!('speechSynthesis' in window))return;speechSynthesis.cancel();
  const clean=t.replace(/```[\s\S]*?```/g,' ').replace(/\$\$[\s\S]*?\$\$/g,' ').replace(/[*_#`>|$\\]/g,'');
  for(const part of clean.match(/[^.!?]+[.!?]*/g)||[]){const u=new SpeechSynthesisUtterance(part.trim());u.rate=1.02;speechSynthesis.speak(u)}}

/* ================= system usage ================= */
async function sysTick(){if(document.hidden)return;try{const s=await (await fetch('/sys')).json();if(!s.ram_total)return;
  const gb=b=>(b/1073741824).toFixed(1),rp=Math.round(s.ram_used/s.ram_total*100),cp=Math.round(s.cpu);
  const lvl=(p,w,h)=>p>=h?'hot':p>=w?'warn':'';
  $('#ramBar').style.width=Math.min(100,rp)+'%';$('#ramBar').className=lvl(rp,75,90);$('#ramTxt').textContent=`${gb(s.ram_used)} / ${Math.round(s.ram_total/1073741824)} GB`;
  $('#cpuBar').style.width=Math.min(100,cp)+'%';$('#cpuBar').className=lvl(cp,60,85);$('#cpuTxt').textContent=cp+'%';
  const grew=window._lastSwap!=null&&s.swap>window._lastSwap+67108864;window._lastSwap=s.swap;
  $('#swapRow').style.display=s.swap>268435456?'':'none';
  $('#swapTxt').textContent=gb(s.swap)+(grew?' GB, growing':' GB, leftover');
  $('#swapTxt').style.color=grew?'var(--bad)':'var(--mute)';
  $('#swapRow').title=grew?'macOS is moving memory to the drive right now: free some RAM.':'Old swap from earlier. Harmless; macOS clears it gradually.'}catch(e){}}
setInterval(sysTick,3000);setTimeout(sysTick,800);

/* ================= keys + boot ================= */
addEventListener('keydown',e=>{
  if(e.key==='Alt'&&!e.repeat&&document.activeElement!==sin){micOn()}
  if(e.metaKey&&e.key==='n'){e.preventDefault();newChat()}
  if(e.metaKey&&e.key==='k'){e.preventDefault();document.body.classList.remove('noside');$('#search').focus()}
  if(e.metaKey&&e.key==='\\'){e.preventDefault();document.body.classList.toggle('noside')}
  if(e.key==='Escape'){if(busy)stop();$$('.menu').forEach(x=>x.classList.remove('open'));pop.classList.remove('open')}});
addEventListener('keyup',e=>{if(e.key==='Alt')micOff()});
$('#sideBtn').onclick=()=>{if(innerWidth<=860)document.body.classList.toggle('showside');else document.body.classList.toggle('noside')};
$('#scrim').onclick=()=>document.body.classList.remove('showside');          // tap outside the drawer closes it
function closeDrawer(){if(innerWidth<=860)document.body.classList.remove('showside')}
async function boot(){try{S=await (await fetch('/state')).json()}catch(e){setTimeout(boot,800);return}
  V=S.voice||{on:false};if(ONPHONE)V={on:store.get('phoneVoice',false)};voiceIcon();$('#voiceSel').value=V.voice||'af_heart';
  if(opts.model!=='auto'&&!S.models.find(m=>m.id===opts.model))opts.model='auto';
  opts.tools=opts.tools.filter(t=>S.groups[t]);modelLabel();thinkLabel();toolCount();permLabel();
  const L=S.loaded&&S.loaded[0];$('#loadedLbl').textContent=L?(S.models.find(m=>m.id===L)||{label:L.split('/').pop()}).label:'';
  render();await loadList();drawSide();inp.focus();
  const last=store.get('openChat','');if(last){try{const r=await fetch('/chats/'+last);if(r.ok){chat={...blank(),...(await r.json())};chat.queue=[];render();drawList();drawSide();resumeIfRunning()}}catch(e){}}}
boot();
</script></body></html>
